name: RISC-V Compliance Suite

on:
  workflow_dispatch:   # manual trigger only - click "Run workflow" on GitHub
  push:
    paths:
      - 'rtl/**'        # only auto-run when RTL actually changes

jobs:
  compliance:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Check out rv32i-pipeline
        uses: actions/checkout@v4

      - name: Install RISC-V toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-riscv64-unknown-elf

      # Ubuntu's apt package is Verilator 4.038 (2021) - it doesn't have
      # --timing, which the assertions/coverage build (Makefile VFLAGS)
      # depends on. conda-forge tracks current releases.
      - name: Install Verilator (conda-forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict

      - name: Install verilator package
        run: mamba install -y -c conda-forge verilator

      - name: Cache riscv-arch-test
        id: arch-test-cache
        uses: actions/cache@v4
        with:
          path: ~/riscv-arch-test
          key: riscv-arch-test-old-framework-2.x

      - name: Clone riscv-arch-test
        if: steps.arch-test-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch old-framework-2.x --depth 1 \
            https://github.com/riscv-non-isa/riscv-arch-test.git ~/riscv-arch-test

      - name: Build simulator
        run: make clean && make all

      - name: Run compliance suite
        env:
          ARCH_TEST: ~/riscv-arch-test
        run: |
          cd compliance
          ./run_compliance.sh
